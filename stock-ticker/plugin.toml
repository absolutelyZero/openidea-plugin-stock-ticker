id = "absolutelyzero.stock-ticker"
name = "Stock Ticker"
version = "0.4.4"
description = "A-share quotes in a WebView side panel, with hover-linked intraday charts, fuzzy symbol search, page-timer refresh and drag-to-reorder."
authors = ["absolutelyZero"]
license = "MIT"
homepage = "https://github.com/absolutelyZero/openidea-plugin-stock-ticker"
change-notes = "0.4.4 — 移除分时图上方的图头，代码/名称/日期等信息统一在图表下方摘要行与读屏标签中呈现，图表整体上移；其余行为不变。"
categories = ["tools"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-view:watchlist"]

[capabilities]
required = ["storage"]
optional = ["net:qt.gtimg.cn", "net:proxy.finance.qq.com", "net:web.ifzq.gtimg.cn"]

[[contributes.commands]]
id = "refresh"
title = "Stock: Refresh Quotes"
category = "Stock"

[[contributes.commands]]
id = "add"
title = "Stock: Add Symbol"
category = "Stock"

[[contributes.commands]]
id = "open"
title = "Stock: Open Quote Page"
category = "Stock"

[[contributes.commands]]
id = "remove"
title = "Stock: Remove Symbol"
category = "Stock"

[[contributes.commands]]
id = "reveal"
title = "Stock: Show Watchlist"
category = "Stock"

[[contributes.commands]]
id = "test-connection"
title = "Stock: Test Data Source"
category = "Stock"

# A single native tool window backed by a `sortable_table`.
[[contributes.views]]
id = "watchlist"
title = "行情"
location = "right"
group = "stock"
web = "web/index.html"

[[contributes.statusBar]]
id = "index"
text = "行情 —"
tooltip = "点击刷新行情"
command = "refresh"

[[contributes.keymaps]]
command = "refresh"
key = "Ctrl+Alt+S"

[contributes.settings]
title = "Stock Ticker"

[[contributes.settings.pages]]
id = "general"
title = "常规"
schema = "settings/general.json"

[[contributes.settings.pages.actions]]
title = "测试连接"
command = "test-connection"
