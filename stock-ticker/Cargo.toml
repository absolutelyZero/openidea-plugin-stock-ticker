[package]
name = "openidea-plugin-stock-ticker"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Vendored SDK from OpenIDEA tag v0.1.39 (plugin API 1.3.0).
openidea-plugin = { path = "../vendor/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
