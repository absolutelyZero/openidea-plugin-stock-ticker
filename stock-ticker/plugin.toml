id = "absolutelyzero.stock-ticker"
name = "Stock Ticker"
version = "0.4.5"
description = "A 股行情侧边栏：四列自选股实时报价，鼠标悬停即看当日分时图，支持代码/名称/拼音模糊搜索、拖拽排序与面板内定时刷新。"
authors = ["absolutelyZero"]
license = "MIT"
homepage = "https://github.com/absolutelyZero/openidea-plugin-stock-ticker"
change-notes = "0.4.5 — 侧边栏视图补上专属图标（view.svg，与市场展示的插件图标同一母题，按 24px 侧栏尺寸重绘），不再显示宿主的默认视图图标；其余行为不变。"
categories = ["tools"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-view:watchlist"]

[capabilities]
required = ["storage"]
optional = ["net:qt.gtimg.cn", "net:proxy.finance.qq.com", "net:web.ifzq.gtimg.cn"]

[[contributes.commands]]
id = "refresh"
title = "Stock: Refresh Quotes"
category = "Stock"

[[contributes.commands]]
id = "add"
title = "Stock: Add Symbol"
category = "Stock"

[[contributes.commands]]
id = "open"
title = "Stock: Open Quote Page"
category = "Stock"

[[contributes.commands]]
id = "remove"
title = "Stock: Remove Symbol"
category = "Stock"

[[contributes.commands]]
id = "reveal"
title = "Stock: Show Watchlist"
category = "Stock"

[[contributes.commands]]
id = "test-connection"
title = "Stock: Test Data Source"
category = "Stock"

# A single native tool window backed by a `sortable_table`.
[[contributes.views]]
id = "watchlist"
title = "行情"
location = "right"
group = "stock"
icon = "view.svg"
web = "web/index.html"

[[contributes.statusBar]]
id = "index"
text = "行情 —"
tooltip = "点击刷新行情"
command = "refresh"

[[contributes.keymaps]]
command = "refresh"
key = "Ctrl+Alt+S"

[contributes.settings]
title = "Stock Ticker"

[[contributes.settings.pages]]
id = "general"
title = "常规"
schema = "settings/general.json"

[[contributes.settings.pages.actions]]
title = "测试连接"
command = "test-connection"
